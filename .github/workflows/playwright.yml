# Runs the Playwright suite against the application under test.
#
# Required repository configuration (Settings > Secrets and variables > Actions):
#   Variable  APP_URL       e.g. https://qtpsudhakar-vibetestq-hrm.up.railway.app/
#   Variable  APP_USER      login user name
#   Secret    APP_PASSWORD  login password (never stored in the repo or a variable)

name: Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # needed to publish the report to the gh-pages branch

jobs:
  test:
    runs-on: ubuntu-latest
    # Serialise runs so two publishes never race on the gh-pages branch.
    concurrency:
      group: playwright-gh-pages
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      CI: true
      APP_URL: ${{ vars.APP_URL }}
      APP_USER: ${{ vars.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --trace off

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Check out gh-pages
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish report to GitHub Pages
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          DEST: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
        run: |
          set -euo pipefail
          cd pages
          rm -rf "$DEST"
          cp -r "$GITHUB_WORKSPACE/playwright-report" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No report changes to publish"
          else
            git commit -m "Publish Playwright report to $DEST"
            git push origin gh-pages
          fi
          echo "Report: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$DEST/"
