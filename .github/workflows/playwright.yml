# Runs the Playwright suite against the application under test.
#
# Required repository configuration (Settings > Secrets and variables > Actions):
#   Variable  APP_URL       e.g. https://qtpsudhakar-vibetestq-hrm.up.railway.app/
#   Variable  APP_USER      login user name
#   Secret    APP_PASSWORD  login password (never stored in the repo or a variable)

name: Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      APP_URL: ${{ vars.APP_URL }}
      APP_USER: ${{ vars.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --trace off

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
